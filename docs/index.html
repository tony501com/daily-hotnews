    const container = document.getElementById('hot-list');

        let html = '';
        hotData.forEach((item, idx) => {

            const word = item.word || '无标题';
            const query = item.query || '';

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[-][-]/g, function(c) {
            return c;
        });
    }
