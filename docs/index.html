                    <div class="appurl">
                        📎 <a href="${escapeHtml(appUrl)}" target="_blank" rel="noopener noreferrer">点击查看详情 🔗</a>
                    </div>
                    <div class="desc">
                        <div class="desc-label">📖 详情描述</div>
                        ${escapeHtml(desc)}
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[-][-]/g, function(c) {
            return c;
        });
    }
</script>
</body>
</html>
