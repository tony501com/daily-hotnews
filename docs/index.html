                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[-][-]/g, function(c) {
            return c;
        });
    }
</script>
</body>
