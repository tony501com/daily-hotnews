name: Daily Hotnews Update
on:
  schedule:
    - cron: '0 0 * * *'  # UTC 00:00 = 北京时间 08:00
  workflow_dispatch:     # 允许手动点击运行
permissions:
  contents: write

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install ddgs trafilatura requests lxml
      - name: Run script
        run: python main.py
      - name: Commit & push results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add output/
          git diff --quiet && git diff --staged --quiet || git commit -m "📰 自动更新热点数据 $(date +%Y-%m-%d)"
          git push
