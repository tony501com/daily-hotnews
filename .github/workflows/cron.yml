name: Daily Hotnews Update
on:
  schedule:
    - cron: '0 0 * * *'  # 北京时间 08:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，避免冲突
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ddgs trafilatura requests lxml
      
      - name: Run script
        run: python main.py
        env:
          PYTHONUTF8: 1
      
      - name: Debug output
        run: |
          echo "📁 docs 目录内容:"
          ls -la docs/
          if [ -f docs/index.html ]; then
            echo "✅ index.html 存在，大小:"
            wc -c docs/index.html
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true  # 强制覆盖，避免冲突
          full_commit_message: "📰 每日热点更新 $(date '+%Y-%m-%d %H:%M')"
