name: Daily Baidu Hotlist Sync

on:
  schedule:
    # 避开整点，设置为国际标准时 22:50
    # 对应北京时间早上 06:50。通过错峰和微调提前，能完美解决 GitHub 服务器的排队延迟，确保在 7:00 左右完成网页更新。
    - cron: '30 21 * * *'
  workflow_dispatch: # 保持开启，方便你随时手动测试

permissions:
  contents: write # 赋予脚本写入仓库和更新网页的权限
  id-token: write  # 允许 GitHub Pages 部署获取 ID Token
  pages: write     # 允许部署到 GitHub Pages

jobs:
  run-spider:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取最新的仓库代码
        uses: actions/checkout@v4

      - name: 2. 初始化 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖库
        run: |
          pip install requests

      - name: 4. 执行爬虫脚本
        run: python generate_news.py

      - name: 5. 自动提交并推送到 GitHub 仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update baidu hotlist [skip ci]" && git push)
